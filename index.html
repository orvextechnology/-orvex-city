
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="ORVEX CITY - Explore a modern African-inspired 3D open world.">
  <title>ORVEX CITY | ORVEX TECHNOLOGIES</title>

  <link rel="stylesheet" href="style.css">

  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
  </script>
</head>

<body>

  <div id="loadingScreen">
    <div class="loading-logo">ORVEX</div>
    <div class="loading-subtitle">CITY</div>
    <div class="loading-track">
      <div id="loadingProgress"></div>
    </div>
    <p id="loadingText">Preparing your city...</p>
  </div>

  
<div id="game">

  <div id="raceHUD">
    <div class="race-brand">ORVEX MOTORSPORT</div>

    <div class="race-stats">
      <div class="stat">
        <small>SPEED</small>
        <strong><span id="speedValue">0</span> KM/H</strong>
      </div>

      <div class="stat">
        <small>DISTANCE</small>
        <strong id="distanceValue">0.00 km</strong>
      </div>
    </div>
  </div>

  <div class="mobile-controls">
    <div class="steering">
      <button id="left">◀</button>
      <button id="right">▶</button>
    </div>

    <div class="racing-buttons">
      <button id="brake">BRAKE</button>
      <button id="nitro">NITRO</button>
      <button id="accelerate">RACE</button>
    </div>
  </div>

  <div class="race-footer">ORVEX TECHNOLOGIES</div>

</div>
  

  <div id="errorMessage" hidden></div>

  <script type="module" src="race.js"></script>

</body>
</html>
